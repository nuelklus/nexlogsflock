services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: nexlogs-flock-backend

    restart: unless-stopped

    env_file:
      - .env

    volumes:
      # Django collected static files
      - ./staticfiles:/app/staticfiles

      # User-uploaded files
      - ./media:/app/media

    ports:
      - "127.0.0.1:8002:8000"

    networks:
      - nexlogs-internal-network

    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120

networks:
  nexlogs-internal-network:
    external: true
